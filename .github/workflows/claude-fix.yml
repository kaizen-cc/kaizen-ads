# "Have Claude fix it" in an error email opens an issue labelled claude-fix. Claude reads it, finds the
# cause, and opens a pull request with the fix. Nothing goes live until someone merges that PR.
# Needs the ANTHROPIC_API_KEY repository secret (Settings › Secrets and variables › Actions).
name: Claude fix

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-fix-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  fix:
    if: github.event.label.name == 'claude-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Vercel only deploys commits from this identity
      - run: git config user.name "kaizen-cc" && git config user.email "santi@kaizenmarketing.agency"
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(npm run *),Bash(npx tsc *),Bash(npx vitest *),Bash(npx eslint *),Bash(npx next typegen*),Bash(git *),Bash(gh pr create *),Bash(gh issue comment *)"
          prompt: |
            You are fixing a production error in Kaizen Ads (this repo). Issue #${{ github.event.issue.number }}:

            ${{ github.event.issue.title }}

            ${{ github.event.issue.body }}

            1. Read AGENTS.md first (this Next.js version differs from what you know; its docs are in node_modules/next/dist/docs/).
            2. Find the root cause in the code. If the error is not caused by our code (e.g. a network blip or a browser extension),
               don't change anything: comment on the issue explaining why, and stop.
            3. Make the smallest safe fix. Match the surrounding code style. Don't touch unrelated files.
               If the database needs a change, add a new file in supabase/migrations/ and say clearly in the PR that it must be applied.
            4. Run: npm run lint && npx next typegen && npx tsc --noEmit && npx vitest run. All must pass.
            5. Create a branch claude/fix-${{ github.event.issue.number }}, commit, push, and open a PR with
               `gh pr create --base main` titled "Fix: <short description>" whose body explains, in plain language for a non-technical owner:
               What happened · Why it happened · What changed · How it was checked. End the body with "Closes #${{ github.event.issue.number }}".
            6. Comment on the issue with the PR link.

      # Low severity (the issue is labelled auto-merge): once Claude's pull request is up, run the same checks as
      # every push and, if they all pass and the fix doesn't touch the database, merge it so it goes live with no one
      # waiting on it. Medium and high fixes are left for someone to review and merge.
      - name: Merge a low-severity fix that passes the checks
        if: contains(github.event.issue.labels.*.name, 'auto-merge')
        env:
          ISSUE: ${{ github.event.issue.number }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -e
          PR=$(gh pr list --head "claude/fix-$ISSUE" --state open --json number --jq '.[0].number')
          if [ -z "$PR" ]; then echo "No fix pull request (Claude found nothing of ours to fix)"; exit 0; fi
          if gh pr diff "$PR" --name-only | grep -q '^supabase/migrations/'; then
            gh pr comment "$PR" --body "This fix changes the database, so it waits for a person to apply the migration and merge it."
            exit 0
          fi
          git fetch origin "claude/fix-$ISSUE" && git checkout "claude/fix-$ISSUE"
          npm ci
          if npx eslint src tests && npx next typegen && npx tsc --noEmit && npm test && npm run test:db; then
            # One commit on main authored as kaizen-cc, the only identity Vercel deploys (Claude's own commits are
            # claude[bot], which Vercel skips)
            TITLE=$(gh pr view "$PR" --json title --jq .title)
            git checkout main && git pull --ff-only origin main
            git merge --squash "origin/claude/fix-$ISSUE"
            git commit -m "$TITLE" -m "Low-severity fix by Claude from #$ISSUE, merged automatically after every check passed."
            git push origin main
            gh pr close "$PR" --delete-branch --comment "Merged into main as $(git rev-parse --short HEAD) (every check passed)."
            gh issue close "$ISSUE" --comment "Low severity, and every check passed: merged automatically. It goes live with this Vercel deploy."
          else
            gh pr comment "$PR" --body "A check failed, so this one wasn't merged automatically. It needs a look."
          fi
